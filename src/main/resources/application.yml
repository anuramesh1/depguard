spring:
  application:
    name: depguard
  config:
    # Local secrets (POSTGRES_PASSWORD) from the gitignored .env file, if present. Lambda uses env vars.
    import: optional:file:.env[.properties]
  autoconfigure:
    # The Lambda adapter brings a Spring Cloud Function auto-config that swaps Tomcat for a
    # "serverless" web server, so locally nothing would listen on :8080. The Lambda handler
    # doesn't need it (StreamLambdaHandlerTest proves that), so it is switched off everywhere.
    exclude: org.springframework.cloud.function.serverless.web.ServerlessAutoConfiguration
  threads:
    virtual:
      enabled: true          # Java 21: each request runs on a cheap virtual thread
  mvc:
    problemdetails:
      enabled: true          # framework errors (404, 415, ...) also return problem-detail JSON
  ai:
    bedrock:
      aws:
        # Credentials come from the default AWS chain: your local profile/SSO, or the Lambda's IAM role.
        region: ${AWS_REGION:us-east-1}
        timeout: 25s         # per model call; API Gateway gives up after 30 s in total
      titan:
        embedding:
          model: amazon.titan-embed-text-v2:0  # 1024 numbers per text, $0.02 per million tokens
          input-type: text
      converse:
        chat:
          options:
            # A cross-region inference profile. Override with the env var
            # SPRING_AI_BEDROCK_CONVERSE_CHAT_OPTIONS_MODEL (e.g. when Haiku 5.5 is enabled for your account).
            model: us.anthropic.claude-haiku-4-5-20251001-v1:0
            temperature: 0.2   # low: triage should be consistent, not creative
            max-tokens: 1500   # caps the cost of one answer
    tools:
      limits:
        # Hard cap on tool calls per triage, enforced by Spring AI (the prompt allows 2 searches). Before phase 7 the
        # only limit was advisory, and a model (Nova Lite) ignored it: 40 searches, 820k input tokens in one triage.
        max-total-tool-calls: 4
        max-calls-per-tool-default: 4
        on-limit-exceeded: throw   # TriageAgent then answers from the facts alone
    model:
      embedding: bedrock-titan # Spring AI's Bedrock starter has two embedding models; use Titan

depguard:
  # Required as the X-Api-Key header on /api/triage and /api/knowledge when set. Empty locally; Terraform sets it on Lambda.
  api-key: ${DEPGUARD_API_KEY:}
  osv:
    base-url: https://api.osv.dev
    connect-timeout: 3s
    read-timeout: 10s
  exploit:
    epss-base-url: https://api.first.org
    kev-feed-url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    connect-timeout: 3s
    read-timeout: 15s
    kev-cache-ttl: 6h        # the catalog changes a few times a week

  langfuse:
    # Tracing to Langfuse Cloud (phase 5). Off unless both keys are set: put them in .env (gitignored).
    host: ${LANGFUSE_HOST:${LANGFUSE_BASE_URL:https://cloud.langfuse.com}}   # LANGFUSE_BASE_URL: the name Langfuse's snippet uses
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    capture-content: ${LANGFUSE_CAPTURE_CONTENT:true}   # prompts, answers, tool results; false = metadata only
    flush-after-request: ${LANGFUSE_FLUSH_AFTER_REQUEST:false}  # true on Lambda (Terraform sets it)
  answer-cache:
    # Reuse a recent answer for the same dependencies and (nearly) the same question: no model call, no cost.
    enabled: ${DEPGUARD_ANSWER_CACHE:true}
    ttl: 6h                      # exploit data changes daily; DepGuard caches KEV for 6 h too
    similarity-threshold: 0.55   # measured: 3/6 paraphrases match, 0/7 different questions (see AnswerCacheProperties)
  pricing:
    # USD per million tokens, us-east-1 on-demand, from the AWS Price List API (2026-11-21). Used for the cost on every
    # model-call span and in the evals. Note: Claude through a "us." (geographic) inference profile costs 10% more than
    # through "global." (Haiku 4.5: $1.10/$5.50 vs $1.00/$5.00); "global." may process requests in any region.
    models:
      - model: us.anthropic.claude-haiku-4-5-20251001-v1:0
        input-per-million: 1.10
        output-per-million: 5.50
        cache-read-per-million: 0.11   # prompt cache: reads at 0.1x input
        cache-write-per-million: 1.375 # writes at 1.25x input (5-minute TTL)
      - model: global.anthropic.claude-haiku-4-5-20251001-v1:0
        input-per-million: 1.00
        output-per-million: 5.00
      - model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
        input-per-million: 3.30
        output-per-million: 16.50
      - model: us.amazon.nova-pro-v1:0
        input-per-million: 0.80
        output-per-million: 3.20
      - model: us.amazon.nova-2-lite-v1:0
        input-per-million: 0.33
        output-per-million: 2.75
      - model: us.amazon.nova-lite-v1:0
        input-per-million: 0.06
        output-per-million: 0.24
      - model: us.amazon.nova-micro-v1:0
        input-per-million: 0.035
        output-per-million: 0.14
      - model: us.meta.llama4-scout-17b-instruct-v1:0
        input-per-million: 0.17
        output-per-million: 0.66
      - model: us.mistral.pixtral-large-2502-v1:0
        input-per-million: 2.00
        output-per-million: 6.00
  rag:
    # "jdbc" = local docker-compose Postgres; "data-api" = Aurora on AWS (Terraform sets this on Lambda)
    store: ${DEPGUARD_RAG_STORE:jdbc}
    top-k: 5
    jdbc:
      url: jdbc:postgresql://localhost:5432/depguard
      username: depguard
      password: ${POSTGRES_PASSWORD:}
    data-api:
      cluster-arn: ${DEPGUARD_RAG_CLUSTER_ARN:}
      secret-arn: ${DEPGUARD_RAG_SECRET_ARN:}
      database: depguard
    ingest:
      osv-dump-url: https://osv-vulnerabilities.storage.googleapis.com/Maven/all.zip
      max-advisories: 0      # 0 = all (~7,300); e.g. 300 for a quick, nearly free local trial
      concurrency: 4         # parallel embedding calls; Bedrock throttles above its per-minute quota
      guides:                # fetched at ingest time; not stored in this repo
        - id: spring-boot-3.0-migration
          title: Spring Boot 3.0 Migration Guide
          raw-url: https://raw.githubusercontent.com/wiki/spring-projects/spring-boot/releasenotes/Spring-Boot-3.0-Migration-Guide.asciidoc
          page-url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-3.0-Migration-Guide
        - id: spring-boot-4.0-migration
          title: Spring Boot 4.0 Migration Guide
          raw-url: https://raw.githubusercontent.com/wiki/spring-projects/spring-boot/releasenotes/Spring-Boot-4.0-Migration-Guide.asciidoc
          page-url: https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide
        - id: spring-framework-6.0
          title: Spring Framework 6.0 Release Notes
          raw-url: https://raw.githubusercontent.com/wiki/spring-projects/spring-framework/Spring-Framework-6.0-Release-Notes.md
          page-url: https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-6.0-Release-Notes
        - id: spring-framework-7.0
          title: Spring Framework 7.0 Release Notes
          raw-url: https://raw.githubusercontent.com/wiki/spring-projects/spring-framework/Spring-Framework-7.0-Release-Notes.md
          page-url: https://github.com/spring-projects/spring-framework/wiki/Spring-Framework-7.0-Release-Notes
        - id: jackson-3-migration
          title: Migrating to Jackson 3
          raw-url: https://raw.githubusercontent.com/FasterXML/jackson/main/jackson3/MIGRATING_TO_JACKSON_3.md
          page-url: https://github.com/FasterXML/jackson/blob/main/jackson3/MIGRATING_TO_JACKSON_3.md

management:
  endpoints:
    web:
      exposure:
        include: health,info # expose only what a load balancer needs
  tracing:
    sampling:
      probability: 1.0       # Boot's default (0.1) would drop 9 of 10 traces; every triage matters here
    export:
      otlp:
        enabled: false       # Boot's generic exporter is off: LangfuseConfig adds the Langfuse one when keys are set
  otlp:
    metrics:
      export:
        enabled: false       # the OpenTelemetry starter also exports metrics to localhost:4318; Langfuse is traces only
  logging:
    export:
      otlp:
        enabled: false       # same for logs
  observations:
    enable:
      # One span per HTTP request in and out would be ~80 spans per triage (one per OSV advisory fetch): noise in
      # Langfuse, and each span counts against its free quota. The tool spans already time every lookup, and
      # without the server span the trace is named after its root, "depguard.triage".
      http.server.requests: false
      http.client.requests: false
