<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1025 620" width="1025" height="620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>DepGuard architecture: serverless on AWS</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- White background so the diagram stays readable on dark-themed pages -->
  <rect width="1025" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="38" font-size="20" font-weight="700" fill="#0f172a">DepGuard architecture</text>
  <text x="20" y="60" font-size="12" fill="#475569">Serverless on AWS · request flow from left to right</text>

  <!-- ============ Request flow ============ -->

  <!-- Client -->
  <rect x="20" y="183" width="150" height="54" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="95" y="206" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
  <text x="95" y="224" font-size="11" fill="#475569" text-anchor="middle">curl · IntelliJ .http</text>

  <!-- API Gateway -->
  <rect x="205" y="183" width="175" height="54" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="292" y="206" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">API Gateway</text>
  <text x="292" y="224" font-size="11" fill="#475569" text-anchor="middle">HTTP API · HTTPS · 5 req/s</text>

  <!-- Lambda container -->
  <rect x="415" y="95" width="420" height="310" rx="10" fill="#fff4e5" stroke="#e8a33d" stroke-width="1.5"/>
  <text x="432" y="120" font-size="14" font-weight="700" fill="#0f172a">AWS Lambda</text>
  <text x="432" y="138" font-size="11" fill="#475569">Java 21 · ARM64 · 1 GB · SnapStart · alias "live" · Spring Boot inside</text>

  <!-- Inside Lambda -->
  <rect x="435" y="183" width="180" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="525" y="206" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">StreamLambdaHandler</text>
  <text x="525" y="224" font-size="11" fill="#475569" text-anchor="middle">event → servlet request</text>

  <rect x="635" y="183" width="180" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="725" y="206" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">ScanController</text>
  <text x="725" y="224" font-size="11" fill="#475569" text-anchor="middle">POST /api/scans</text>

  <rect x="635" y="258" width="180" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="725" y="281" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">ScanService</text>
  <text x="725" y="299" font-size="11" fill="#475569" text-anchor="middle">rank findings, pick upgrade</text>

  <rect x="435" y="333" width="180" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="525" y="356" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">PomParser</text>
  <text x="525" y="374" font-size="11" fill="#475569" text-anchor="middle">safe XML parsing (no XXE)</text>

  <rect x="635" y="333" width="180" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="725" y="356" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">OsvClient</text>
  <text x="725" y="374" font-size="11" fill="#475569" text-anchor="middle">1 batch call + parallel fetches</text>

  <!-- External: OSV and logs -->
  <rect x="870" y="333" width="135" height="54" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="937" y="356" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">OSV.dev</text>
  <text x="937" y="374" font-size="11" fill="#475569" text-anchor="middle">live advisory data</text>

  <rect x="870" y="183" width="135" height="54" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="937" y="206" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">CloudWatch</text>
  <text x="937" y="224" font-size="11" fill="#475569" text-anchor="middle">logs · 7-day retention</text>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="170" y1="210" x2="203" y2="210" marker-end="url(#arrow)"/>
    <line x1="380" y1="210" x2="433" y2="210" marker-end="url(#arrow)"/>
    <line x1="615" y1="210" x2="633" y2="210" marker-end="url(#arrow)"/>
    <line x1="725" y1="237" x2="725" y2="256" marker-end="url(#arrow)"/>
    <line x1="725" y1="312" x2="725" y2="331" marker-end="url(#arrow)"/>
    <polyline points="635,285 525,285 525,331" marker-end="url(#arrow)"/>
    <line x1="815" y1="360" x2="868" y2="360" marker-end="url(#arrow)"/>
    <line x1="815" y1="210" x2="868" y2="210" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  </g>
  <text x="187" y="173" font-size="11" fill="#475569" text-anchor="middle">pom.xml</text>
  <text x="187" y="257" font-size="11" fill="#475569" text-anchor="middle">JSON report</text>

  <!-- ============ Deploy and local run ============ -->
  <line x1="20" y1="425" x2="1005" y2="425" stroke="#e2e8f0"/>
  <text x="20" y="448" font-size="13" font-weight="700" fill="#0f172a">How it gets to AWS</text>

  <rect x="20" y="458" width="200" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="120" y="479" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">scripts/deploy.sh</text>
  <text x="120" y="496" font-size="11" fill="#475569" text-anchor="middle">tests → build → deploy → health</text>

  <rect x="260" y="458" width="200" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="360" y="479" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">./mvnw -Plambda package</text>
  <text x="360" y="496" font-size="11" fill="#475569" text-anchor="middle">target/depguard-lambda.zip</text>

  <rect x="500" y="458" width="200" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="600" y="479" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Terraform</text>
  <text x="600" y="496" font-size="11" fill="#475569" text-anchor="middle">infra/serverless: API GW + Lambda</text>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="220" y1="483" x2="258" y2="483" marker-end="url(#arrow)"/>
    <line x1="460" y1="483" x2="498" y2="483" marker-end="url(#arrow)"/>
  </g>

  <rect x="740" y="458" width="265" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="872" y="479" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Local: ./mvnw spring-boot:run</text>
  <text x="872" y="496" font-size="11" fill="#475569" text-anchor="middle">Tomcat :8080 → ScanController (no Lambda)</text>

  <!-- ============ Later phases ============ -->
  <text x="20" y="542" font-size="13" font-weight="700" fill="#0f172a">Coming in later phases</text>
  <g fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4">
    <rect x="20" y="552" width="235" height="48" rx="8"/>
    <rect x="275" y="552" width="235" height="48" rx="8"/>
    <rect x="530" y="552" width="235" height="48" rx="8"/>
    <rect x="785" y="552" width="220" height="48" rx="8"/>
  </g>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="137" y="572" font-weight="700">Amazon Bedrock · phase 2</text>
    <text x="137" y="589" font-size="11">Spring AI agent + tools</text>
    <text x="392" y="572" font-weight="700">Aurora Serverless v2 · phase 3</text>
    <text x="392" y="589" font-size="11">pgvector via RDS Data API</text>
    <text x="647" y="572" font-weight="700">Langfuse · phase 5</text>
    <text x="647" y="589" font-size="11">LLM traces, tokens, cost</text>
    <text x="895" y="572" font-weight="700">Spring Security · phase 8</text>
    <text x="895" y="589" font-size="11">JWT authorizer, roles</text>
  </g>
</svg>
