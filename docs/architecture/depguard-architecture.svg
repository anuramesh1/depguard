<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1025 720" width="1025" height="720" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>DepGuard architecture: serverless on AWS</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- White background so the diagram stays readable on dark-themed pages -->
  <rect width="1025" height="720" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="38" font-size="20" font-weight="700" fill="#0f172a">DepGuard architecture</text>
  <text x="20" y="60" font-size="12" fill="#475569">Serverless on AWS · request flow from left to right · purple = the AI agent's path</text>

  <!-- ============ Request flow ============ -->

  <!-- Client -->
  <rect x="20" y="183" width="150" height="54" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="95" y="206" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
  <text x="95" y="224" font-size="11" fill="#475569" text-anchor="middle">curl + Bearer token</text>

  <!-- Login: Cognito issues the token the client sends -->
  <rect x="20" y="263" width="150" height="54" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="95" y="286" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Amazon Cognito</text>
  <text x="95" y="304" font-size="11" fill="#475569" text-anchor="middle">login → JWT · 2 roles</text>

  <!-- API Gateway -->
  <rect x="205" y="183" width="175" height="54" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="292" y="206" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">API Gateway</text>
  <text x="292" y="224" font-size="11" fill="#475569" text-anchor="middle">HTTPS · 5 req/s · JWT check</text>

  <!-- Externals used by the agent (left) -->
  <rect x="205" y="263" width="175" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="292" y="286" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Amazon Bedrock</text>
  <text x="292" y="304" font-size="11" fill="#475569" text-anchor="middle">Claude Haiku 4.5 · Titan v2</text>

  <rect x="205" y="343" width="175" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="292" y="366" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Aurora Serverless v2</text>
  <text x="292" y="384" font-size="11" fill="#475569" text-anchor="middle">pgvector · answer cache</text>

  <rect x="205" y="423" width="175" height="54" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="292" y="446" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">EPSS · CISA KEV</text>
  <text x="292" y="464" font-size="11" fill="#475569" text-anchor="middle">exploit signals, free</text>

  <!-- Lambda container -->
  <rect x="415" y="95" width="420" height="410" rx="10" fill="#fff4e5" stroke="#e8a33d" stroke-width="1.5"/>
  <text x="432" y="120" font-size="14" font-weight="700" fill="#0f172a">AWS Lambda</text>
  <text x="432" y="138" font-size="11" fill="#475569">Java 21 · ARM64 · 1 GB · SnapStart · alias "live" · Spring Boot inside</text>

  <!-- Inside Lambda -->
  <rect x="435" y="183" width="180" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="525" y="206" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">StreamLambdaHandler</text>
  <text x="525" y="224" font-size="11" fill="#475569" text-anchor="middle">event → servlet request</text>

  <rect x="635" y="183" width="180" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="725" y="206" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Controllers</text>
  <text x="725" y="224" font-size="11" fill="#475569" text-anchor="middle">scans · triage · search · upgrades</text>

  <rect x="435" y="263" width="180" height="54" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="525" y="286" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">TriageAgent</text>
  <text x="525" y="304" font-size="11" fill="#475569" text-anchor="middle">facts in code · 1 tool · cache</text>

  <rect x="635" y="263" width="180" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="725" y="286" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">ScanService</text>
  <text x="725" y="304" font-size="11" fill="#475569" text-anchor="middle">parse pom, rank findings</text>

  <rect x="435" y="343" width="155" height="54" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="512" y="366" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">HybridRetriever</text>
  <text x="512" y="384" font-size="11" fill="#475569" text-anchor="middle">vector + full-text, RRF</text>

  <rect x="635" y="343" width="180" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="725" y="366" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">OsvClient</text>
  <text x="725" y="384" font-size="11" fill="#475569" text-anchor="middle">1 batch call + parallel fetches</text>

  <rect x="435" y="423" width="180" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="525" y="446" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">EpssClient · KevClient</text>
  <text x="525" y="464" font-size="11" fill="#475569" text-anchor="middle">batched · KEV cached 6 h</text>

  <rect x="635" y="423" width="180" height="54" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="725" y="446" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">UpgradeService</text>
  <text x="725" y="464" font-size="11" fill="#475569" text-anchor="middle">propose · four-eyes approve</text>

  <!-- Externals (right) -->
  <rect x="870" y="183" width="135" height="54" rx="8" fill="#fce7f3" stroke="#db2777"/>
  <text x="937" y="206" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">CloudWatch</text>
  <text x="937" y="224" font-size="11" fill="#475569" text-anchor="middle">logs · 7-day retention</text>

  <rect x="870" y="263" width="135" height="54" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="937" y="286" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">Langfuse</text>
  <text x="937" y="304" font-size="11" fill="#475569" text-anchor="middle">traces · cost · scores</text>

  <rect x="870" y="423" width="135" height="54" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="937" y="446" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">GitHub</text>
  <text x="937" y="464" font-size="11" fill="#475569" text-anchor="middle">pull request (demo repo)</text>

  <rect x="870" y="343" width="135" height="54" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="937" y="366" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">OSV.dev</text>
  <text x="937" y="384" font-size="11" fill="#475569" text-anchor="middle">live advisory data</text>

  <!-- Arrows -->
  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="170" y1="210" x2="203" y2="210" marker-end="url(#arrow)"/>
    <line x1="380" y1="210" x2="433" y2="210" marker-end="url(#arrow)"/>
    <line x1="95" y1="237" x2="95" y2="261" marker-end="url(#arrow)"/>
    <line x1="615" y1="210" x2="633" y2="210" marker-end="url(#arrow)"/>
    <line x1="745" y1="237" x2="745" y2="261" marker-end="url(#arrow)"/>
    <polyline points="680,237 680,250 525,250 525,261" marker-end="url(#arrow)"/>
    <line x1="725" y1="317" x2="725" y2="341" marker-end="url(#arrow)"/>
    <line x1="815" y1="370" x2="868" y2="370" marker-end="url(#arrow)"/>
    <line x1="815" y1="210" x2="868" y2="210" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <line x1="835" y1="290" x2="868" y2="290" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
    <line x1="815" y1="450" x2="868" y2="450" marker-end="url(#arrow)"/>
    <polyline points="815,228 825,228 825,440 817,440" marker-end="url(#arrow)"/>
  </g>
  <!-- Agent tool calls, model calls and knowledge-base queries (purple) -->
  <g stroke="#7c3aed" stroke-width="1.5" fill="none">
    <line x1="615" y1="290" x2="633" y2="290" marker-end="url(#arrow-purple)"/>
    <line x1="512" y1="317" x2="512" y2="341" marker-end="url(#arrow-purple)"/>
    <line x1="605" y1="317" x2="605" y2="421" marker-end="url(#arrow-purple)"/>
    <line x1="435" y1="290" x2="382" y2="290" marker-end="url(#arrow-purple)"/>
    <line x1="435" y1="370" x2="382" y2="370" marker-end="url(#arrow-purple)"/>
    <line x1="435" y1="450" x2="382" y2="450" marker-end="url(#arrow-purple)"/>
  </g>
  <text x="187" y="173" font-size="11" fill="#475569" text-anchor="middle">pom.xml ⇄ JSON</text>

  <!-- ============ Deploy, ingest and local run ============ -->
  <line x1="20" y1="525" x2="1005" y2="525" stroke="#e2e8f0"/>
  <text x="20" y="548" font-size="13" font-weight="700" fill="#0f172a">How it gets to AWS</text>

  <rect x="20" y="558" width="200" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="120" y="579" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">scripts/deploy.sh</text>
  <text x="120" y="596" font-size="11" fill="#475569" text-anchor="middle">tests → build → deploy → health</text>

  <rect x="260" y="558" width="200" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="360" y="579" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Terraform</text>
  <text x="360" y="596" font-size="11" fill="#475569" text-anchor="middle">Lambda, API GW, Aurora, IAM</text>

  <rect x="500" y="558" width="200" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="600" y="579" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">scripts/ingest.sh aws</text>
  <text x="600" y="596" font-size="11" fill="#475569" text-anchor="middle">OSV export + guides → Aurora</text>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <line x1="220" y1="583" x2="258" y2="583" marker-end="url(#arrow)"/>
    <line x1="460" y1="583" x2="498" y2="583" marker-end="url(#arrow)"/>
  </g>

  <rect x="740" y="558" width="265" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="872" y="579" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Local: ./mvnw spring-boot:run</text>
  <text x="872" y="596" font-size="11" fill="#475569" text-anchor="middle">Tomcat :8080 · Postgres + pgvector in Docker</text>

  <!-- ============ Security and guardrails ============ -->
  <text x="20" y="642" font-size="13" font-weight="700" fill="#0f172a">Security and guardrails (free at demo scale)</text>
  <text x="1005" y="642" font-size="11" fill="#475569" text-anchor="end">Evals: ./mvnw test -Pevals · model benchmark: -Dtest=ModelBenchmark</text>
  <g fill="#f3f0ff" stroke="#7c3aed">
    <rect x="20" y="652" width="235" height="48" rx="8"/>
    <rect x="275" y="652" width="235" height="48" rx="8"/>
    <rect x="530" y="652" width="235" height="48" rx="8"/>
    <rect x="785" y="652" width="220" height="48" rx="8"/>
  </g>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <text x="137" y="672" font-weight="700">SSM Parameter Store</text>
    <text x="137" y="689" font-size="11">secrets read at startup</text>
    <text x="392" y="672" font-weight="700">Alarms + budget</text>
    <text x="392" y="689" font-size="11">5xx, p95, throttles; 5 Lambdas max</text>
    <text x="647" y="672" font-weight="700">Upgrade PRs → GitHub</text>
    <text x="647" y="689" font-size="11">four-eyes MAINTAINER approval</text>
    <text x="895" y="672" font-weight="700">Cognito + Spring Security</text>
    <text x="895" y="689" font-size="11">JWT at gateway and app; roles</text>
  </g>
</svg>
