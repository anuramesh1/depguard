# Local infrastructure for later phases. Phase 1 (the scan API) does not need any of it.
#   docker compose up -d
# Langfuse is added in phase 5 (its self-hosted stack brings its own ClickHouse, Redis and MinIO).

services:
  postgres:
    image: pgvector/pgvector:pg17   # Postgres with the pgvector extension: phase 3 hybrid search
    environment:
      POSTGRES_DB: depguard
      POSTGRES_USER: depguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"       # bound to localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depguard"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine         # phase 6: semantic cache
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
